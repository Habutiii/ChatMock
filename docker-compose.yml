services:
  chatmock:
    build:
      context: .
    container_name: chatmock
    command: ["serve"]
    env_file: .env
    environment:
      - CHATGPT_LOCAL_HOME=/app/data
      - PORT=${PORT:-9099}
    ports:
      - "${CHATMOCK_PUBLISH_HOST:-127.0.0.1}:${PORT:-9099}:${PORT:-9099}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request,sys; port=os.getenv('PORT', '9099'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health').status==200 else 1)\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chatmock-login:
    build:
      context: .
    profiles: ["login"]
    command: ["login"]
    environment:
      - CHATGPT_LOCAL_HOME=/app/data
      - CHATGPT_LOCAL_LOGIN_BIND=0.0.0.0
    volumes:
      - ./data:/app/data
    ports:
      - "${CHATMOCK_PUBLISH_HOST:-127.0.0.1}:1455:1455"
